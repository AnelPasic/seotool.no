  - name: insightGroup
    label: Innsikt
    type: group
    items:
      - name: managedArticles
        label: Artikler
        type: collection
        path: src/content/pages/managed-articles
        format: json
        subfolders: false
        filename: { template: "{fields.slug}.json", field: false }
        operations: { create: true, rename: false, delete: true }
        description: "Create, edit and delete articles here, including the original article. Check inbound links and redirects first; other fixed pages stay protected."
        view:
          primary: seo.title
          fields: [seo.title, slug]
          search: [seo.title, slug]
        fields:
          - name: slug
            label: Article URL slug
            type: string
            required: true
            pattern:
              regex: "^innsikt/[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: "Use lowercase letters, numbers and hyphens; articles start with innsikt/."
            description: "Unique public URL /innsikt/your-guide/. Choose it before saving."
          - *rootSeo
